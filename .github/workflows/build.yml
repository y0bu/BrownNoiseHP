name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to publish a release as (e.g. v1.0.0). Leave empty to only build.'
        required: false
        default: ''

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            artifact: BrownSweep-Linux-x86_64
            cmake_args: ''
          - name: Windows
            os: windows-latest
            artifact: BrownSweep-Windows-x64
            cmake_args: '-A x64'
          - name: macOS
            os: macos-latest
            artifact: BrownSweep-macOS-universal
            cmake_args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13'

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libfontconfig1-dev libglu1-mesa-dev mesa-common-dev

      # The DSP core has no JUCE dependency, so it is worth proving it still
      # builds and passes on its own before pulling the framework in.
      - name: Configure DSP and tests
        shell: bash
        run: cmake -S . -B build-dsp -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DBROWNSWEEP_BUILD_PLUGIN=OFF ${{ matrix.cmake_args }}

      - name: Build DSP and tests
        shell: bash
        run: cmake --build build-dsp --config "$BUILD_TYPE" --parallel 4

      - name: Run tests
        shell: bash
        run: ctest --test-dir build-dsp --build-config "$BUILD_TYPE" --output-on-failure

      - name: Configure plugin
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" ${{ matrix.cmake_args }}

      - name: Build plugin
        shell: bash
        run: cmake --build build --config "$BUILD_TYPE" --parallel 4

      - name: Stage artefacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          artefacts=$(find build -maxdepth 4 -type d -name "BrownSweep_artefacts" | head -1)
          if [ -z "$artefacts" ]; then echo "no artefacts directory"; find build -maxdepth 4 -type d; exit 1; fi

          vst3=$(find "$artefacts" -maxdepth 3 -name "BrownSweep.vst3" | head -1)
          if [ -z "$vst3" ]; then echo "no VST3 produced"; find "$artefacts" -maxdepth 4; exit 1; fi
          cp -R "$vst3" dist/

          standalone=$(find "$artefacts" -maxdepth 3 -type d -name "Standalone" | head -1)
          if [ -n "$standalone" ]; then cp -R "$standalone"/* dist/ 2>/dev/null || true; fi

          cp README.md LICENSE dist/
          find dist -maxdepth 3 | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/release/${name}.zip" .)
          done
          ls -la release

      - name: Write release notes
        run: |
          cat > release-notes.md <<'NOTES'
          **BrownSweep - Perceptual High-Pass**

          A high-pass filter whose upward cutoff automation reads as a loss of energy rather than
          as low-frequency removal that leaves the top end exposed.

          ### Install

          Download the archive for your platform, unzip it, and copy `BrownSweep.vst3` into your
          VST3 folder:

          | platform | destination |
          |---|---|
          | Windows | `C:\Program Files\Common Files\VST3\` |
          | macOS | `~/Library/Audio/Plug-Ins/VST3/` |
          | Linux | `~/.vst3/` |

          A standalone application is included in the same archive.

          ### macOS note

          These builds are **not code-signed or notarised**. The first time you load the plug-in,
          macOS may refuse to open it. Either right-click it in Finder and choose Open, or clear
          the quarantine flag:

          ```
          xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/BrownSweep.vst3
          ```

          See the README for what the plug-in does and why.
          NOTES

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          echo "publishing $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip --clobber
            gh release edit "$TAG" --title "BrownSweep $TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" release/*.zip \
              --target "$GITHUB_SHA" \
              --title "BrownSweep $TAG" \
              --notes-file release-notes.md \
              --latest
          fi
